[project]
name = "cybermap-mcp"
version = "0.1.0"
description = "MCP server aggregating 10 cyberspace mapping / threat intel platforms: Fofa, Hunter, Quake, Shodan, Censys, ZoomEye, ThreatBook, 0.zone, DayDayMap, VirusTotal"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
cybermap-mcp = "cybermap_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cybermap_mcp*"]
