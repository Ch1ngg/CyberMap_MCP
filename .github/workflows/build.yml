name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      - name: Go vet + test
        working-directory: go
        run: |
          go vet ./...
          go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python test
        run: |
          pip install -e '.[dev]'
          pytest tests -q

  release:
    # Cross-compile the Go binary on every tag; attach artifacts to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BIN=../dist/cybermap-mcp-$GOOS-$GOARCH
          [ "$GOOS" = windows ] && BIN=$BIN.exe
          mkdir -p ../dist
          go build -trimpath -ldflags '-s -w' -o "$BIN" .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cybermap-mcp-*
